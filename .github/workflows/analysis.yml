---
# GHA workflow to run Static Analysis and submit results to GitHub Code Scanning Alerts
name: "Analysis"

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - ".github/workflows/analysis.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - ".github/workflows/analysis.yml"

env:
  build: "${{ github.workspace }}/build"
  config: "Debug"

# One run per workflow per ref. A new push cancels the run it superseded, except on main,
# where each merge should be allowed to finish reporting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: CppCoreCheckRules
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: cmake -B ${{ env.build }} -DCMAKE_BUILD_TYPE=${{ env.config }}

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        # Provide a unique ID to access the sarif output path
        id: run-core-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          buildConfiguration: ${{ env.config }}
          # Ruleset file that will determine what checks will be run
          ruleset: ${{ github.workspace }}/nanodbc.ruleset
          # Paths to ignore analysis of CMake targets and includes. Neither the tests nor
          # the examples are shipped to anyone, and their findings drown out the library's.
          # The list is ";" separated.
          ignoredPaths: ${{ github.workspace }}/test;${{ github.workspace }}/example

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ steps.run-core-analysis.outputs.sarif }}
          # Each tool needs a category of its own, or the three uploads for a commit
          # overwrite each other and the losers' alerts are never superseded.
          category: msvc-core-guidelines

      # Upload SARIF file as an Artifact to download and view
      - name: Upload SARIF as an Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-core-guidelines
          path: ${{ steps.run-core-analysis.outputs.sarif }}
          overwrite: true

  native:
    name: NativeRecommendedRules
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: cmake -B ${{ env.build }} -DCMAKE_BUILD_TYPE=${{ env.config }}

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        # Provide a unique ID to access the sarif output path
        id: run-native-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          buildConfiguration: ${{ env.config }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset
          # Paths to ignore analysis of CMake targets and includes. Neither the tests nor
          # the examples are shipped to anyone, and their findings drown out the library's.
          # The list is ";" separated.
          ignoredPaths: ${{ github.workspace }}/test;${{ github.workspace }}/example

      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ steps.run-native-analysis.outputs.sarif }}
          category: msvc-native-recommended

      # Upload SARIF file as an Artifact to download and view
      - name: Upload SARIF as an Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-native-recommended
          path: ${{ steps.run-native-analysis.outputs.sarif }}
          overwrite: true

  flawfinder:
    name: Flawfinder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flawfinder
        run: pipx install flawfinder==2.0.20

      # --minlevel would be the obvious lever and it does not work: flawfinder honours it in
      # the text report and ignores it in the SARIF writer, so everything it knows is in the
      # file whatever is asked for. The filtering therefore happens below, by rule, which is
      # the same shape as nanodbc.ruleset and keeps the reason beside the id.
      - name: Run Flawfinder
        run: >
          flawfinder --sarif --exclude './test/*' --exclude './example/*' ./
          > flawfinder_raw.sarif

      # Flawfinder matches on names, with no types and no call graph, so in a library whose
      # job is handing fixed buffers to a C API its lower levels say nothing. Each rule below
      # is one where every hit in this library is the C API showing through:
      #
      #   FF1040 misc/open     21 hits, every one nanodbc's own open() meeting POSIX open(2)
      #   FF1013 buffer/char    4 hits, the SQLGetData buffers, whose size is passed to the
      #                         call that fills them
      #   FF1022 buffer/strlen  2 hits, over inputs the overload documents as NUL terminated
      #   FF1071 buffer/equal   2 hits, the null sentry, whose length the binding contract fixes
      #   FF1004 buffer/memcpy  1 hit, into a SAFEARRAY allocated at exactly that length
      #
      # Anything flawfinder reports that is not on this list is a finding to answer rather
      # than an id to add here. The levels with an answer that is not "read the call" - gets,
      # strcpy, sprintf, system - are all still reported, and nanodbc uses none of them.
      - name: Drop the rules nanodbc has no answer to
        run: |
          jq '.runs[0].results |= map(
                select(.ruleId as $r
                  | ["FF1040", "FF1013", "FF1022", "FF1071", "FF1004"]
                  | index($r) | not))' \
            flawfinder_raw.sarif > flawfinder_results.sarif
          echo "kept $(jq '.runs[0].results | length' flawfinder_results.sarif) of \
            $(jq '.runs[0].results | length' flawfinder_raw.sarif) findings" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{github.workspace}}/flawfinder_results.sarif
          category: flawfinder

      # The unfiltered report, so what the step above dropped stays inspectable.
      - name: Upload the unfiltered SARIF as an Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-flawfinder-unfiltered
          path: flawfinder_raw.sarif
          overwrite: true
