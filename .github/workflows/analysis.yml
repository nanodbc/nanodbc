---
name: "Analysis"

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - ".github/workflows/analysis.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - ".github/workflows/analysis.yml"

env:
  build: "${{ github.workspace }}/build"
  config: "Debug"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  core:
    name: CppCoreCheckRules
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: cmake -B ${{ env.build }} -DCMAKE_BUILD_TYPE=${{ env.config }}

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        id: run-core-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          buildConfiguration: ${{ env.config }}
          ruleset: ${{ github.workspace }}/nanodbc.ruleset
          ignoredPaths: ${{ github.workspace }}/test;${{ github.workspace }}/example

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ${{ steps.run-core-analysis.outputs.sarif }}
          category: msvc-core-guidelines

      - name: Upload SARIF as an Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-core-guidelines
          path: ${{ steps.run-core-analysis.outputs.sarif }}
          overwrite: true

  native:
    name: NativeRecommendedRules
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure CMake
        run: cmake -B ${{ env.build }} -DCMAKE_BUILD_TYPE=${{ env.config }}

      - name: Run MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        id: run-native-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          buildConfiguration: ${{ env.config }}
          ruleset: NativeRecommendedRules.ruleset
          ignoredPaths: ${{ github.workspace }}/test;${{ github.workspace }}/example

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ${{ steps.run-native-analysis.outputs.sarif }}
          category: msvc-native-recommended

      - name: Upload SARIF as an Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-native-recommended
          path: ${{ steps.run-native-analysis.outputs.sarif }}
          overwrite: true

  flawfinder:
    name: Flawfinder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Flawfinder
        run: pipx install flawfinder==2.0.20

      - name: Run Flawfinder
        run: >
          flawfinder --sarif --exclude './test/*' --exclude './example/*' ./
          > flawfinder_raw.sarif

      - name: Drop the rules nanodbc has no answer to
        run: |
          jq '.runs[0].results |= map(
                select(.ruleId as $r
                  | ["FF1040", "FF1013", "FF1022", "FF1071", "FF1004"]
                  | index($r) | not))' \
            flawfinder_raw.sarif > flawfinder_results.sarif
          echo "kept $(jq '.runs[0].results | length' flawfinder_results.sarif) of \
            $(jq '.runs[0].results | length' flawfinder_raw.sarif) findings" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: ${{github.workspace}}/flawfinder_results.sarif
          category: flawfinder

      - name: Upload the unfiltered SARIF as an Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-flawfinder-unfiltered
          path: flawfinder_raw.sarif
          overwrite: true
