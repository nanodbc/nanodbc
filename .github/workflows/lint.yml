---
# GHA workflow to check well-formedness of sources, docs and auxiliary files
name: "Lint"

on:
  push:
    branches:
      - main
  pull_request:

# One run per workflow per ref. A new push cancels the run it superseded, except on main,
# where each merge should be allowed to finish reporting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # source code format checked before builds by ci-{linux,windows}.yml

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: avto-dev/markdown-lint@04d43ee9191307b50935a753da3b775ab695eceb # v1.5.0
        with:
          args: "**/*.md"
      - uses: docker://oskarstark/doctor-rst@sha256:6aa5162837be9d25505b2bcdd154bfe7352057503ce9de1b492b254c8e61a0e3 # 1.78.0
        with:
          args: --short --error-format=github
        env:
          DOCS_DIR: "doc/"
      # DOCtor-RST checks style; rstcheck checks that the reStructuredText actually
      # parses. The sphinx extra teaches it the roles and directives Sphinx adds, such
      # as :ref: and toctree, which plain docutils does not know. Configured by
      # .rstcheck.cfg. Pinned, because a later release may add checks the docs have
      # never been held to.
      - name: Install rstcheck
        run: python3 -m pip install --disable-pip-version-check "rstcheck[sphinx]==6.3.0"
      - name: Run rstcheck
        run: rstcheck doc/*.rst

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile.dev
