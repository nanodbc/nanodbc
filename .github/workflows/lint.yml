---
# GHA workflow to check well-formedness of sources, docs and auxiliary files
name: "Lint"

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  # source code format checked before builds by ci-{linux,windows}.yml

  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: avto-dev/markdown-lint@v1
      with:
        args: '**/*.md'
    - uses: docker://oskarstark/doctor-rst
      with:
        args: --short --error-format=github
      env:
        DOCS_DIR: 'doc/'

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: hadolint/hadolint-action@v2.0.0
      with:
        dockerfile: Dockerfile.dev

  # The Vagrantfile used to be validated here, on macos-12. That runner image has been
  # retired, and Vagrant is not present on the images that replaced it, so the job could
  # never start. The Vagrantfile itself is stale too, building on bento/ubuntu-18.04, so it
  # wants a refresh before it is worth validating again.
