name: "Lint"

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: avto-dev/markdown-lint@04d43ee9191307b50935a753da3b775ab695eceb # v1.5.0
        with:
          args: "**/*.md"
      - uses: docker://oskarstark/doctor-rst@sha256:6aa5162837be9d25505b2bcdd154bfe7352057503ce9de1b492b254c8e61a0e3 # 1.78.0
        with:
          args: --short --error-format=github
        env:
          DOCS_DIR: "doc/"
      - name: Install rstcheck
        run: python3 -m pip install --disable-pip-version-check "rstcheck[sphinx]==6.3.0"
      # rstcheck compiles the C++ blocks, and the ones reaching for an ODBC constant need
      # the ODBC headers to compile at all.
      - name: Install ODBC headers
        run: sudo apt-get -o DPkg::Lock::Timeout=120 install -y unixodbc-dev
      - name: Run rstcheck
        run: rstcheck doc/*.rst
      - name: Install cmakelang
        run: python3 -m pip install --disable-pip-version-check "cmakelang==0.6.13"
      - name: Run cmake-lint
        run: cmake-lint $(git ls-files '*CMakeLists.txt' '*.cmake')

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile.dev
