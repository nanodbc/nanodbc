name: "CI Windows"

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci-windows.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci-windows.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: "20"
          check-path: "."

  build-msvc:
    needs: [check-format]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        cxxstd: ["20", "17"]
        include:
          - os: windows-latest
            vs: 2026
          - os: windows-2022
            vs: 2022
    name: build-vs${{ matrix.vs }}-std-${{ matrix.cxxstd }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: |
          cmake --version
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }}
      - name: Show generator and toolset
        run: |
          Select-String -Path ${{ github.workspace }}/build/CMakeCache.txt -Pattern "CMAKE_GENERATOR:|CMAKE_GENERATOR_TOOLSET:|CMAKE_CXX_COMPILER:"
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel

  build-mingw:
    needs: [check-format]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cxxstd: "17", configuration: Release, warnings-as-errors: "OFF" }
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: |
          cmake --version
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "MinGW Makefiles" -D CMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DCMAKE_COMPILE_WARNING_AS_ERROR=${{ matrix.warnings-as-errors }}
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --parallel

  test-utility:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: |
          cmake --version
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel --target utility_tests
      - name: Test
        run: |
          ctest --test-dir ${{ github.workspace }}/build --build-config Release --output-on-failure --no-tests=error -R utility_tests

  test-mssql:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mssql: [2019]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQL Server
        uses: potatoqualitee/mssqlsuite@2291d923e83859edd871679c05b379037376761f # v1.12
        with:
          install: localdb
          sa-password: Password!123
          version: ${{ matrix.mssql }}
      - name: Check
        run: |
          $deadline = (Get-Date).AddSeconds(90)
          do {
            sqlcmd -S "(localdb)\MSSQLLocalDB" -U sa -P "Password!123" -Q "SELECT @@VERSION;"
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 10
          } while ((Get-Date) -lt $deadline)
          if ($LASTEXITCODE -ne 0) { throw "LocalDB never became reachable" }
          Get-OdbcDriver -Platform 64-bit | Select-Object -ExpandProperty Name
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel --target mssql_tests
      - name: Test
        run: |
          $env:NANODBC_TEST_CONNSTR_MSSQL="Driver={ODBC Driver 17 for SQL Server};Server=(localdb)\MSSQLLocalDB;Database=tempdb;UID=sa;PWD=Password!123;"
          ctest --test-dir ${{ github.workspace }}/build --build-config Release --output-on-failure --no-tests=error -R mssql_tests

  test-mariadb:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["12.3", "11.8", "11.4", "10.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MariaDB ${{ matrix.mariadb }}
        uses: ankane/setup-mariadb@e34d4859081a8192918ea2302b7c9a71475a0d73 # v1
        with:
          database: nanodbc
          mariadb-version: ${{ matrix.mariadb }}
      - name: Install MySQL Connector
        run: |
          choco install mysql.odbc
      - name: Check
        run: |
          mysql -D nanodbc -e 'SELECT VERSION()'
          Get-OdbcDriver -Platform 64-bit | Select-Object -ExpandProperty Name
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel --target mysql_tests
      - name: Test
        run: |
          $driver = Get-OdbcDriver -Platform 64-bit -Name "MySQL ODBC * ANSI Driver" | Select-Object -First 1 -ExpandProperty Name
          $env:NANODBC_TEST_CONNSTR_MYSQL="Driver={$driver};Server=127.0.0.1;Database=nanodbc;User=root;Password=;big_packets=1;NO_SCHEMA=false"
          ctest --test-dir ${{ github.workspace }}/build --build-config Release --output-on-failure --no-tests=error -R mysql_tests

  test-mysql:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mysql: ["9.7", "8.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install MySQL ${{ matrix.mysql }}
        uses: ankane/setup-mysql@19fbb7ee54446ac7f3aed34db192ec70dbec6092 # v1
        with:
          database: nanodbc
          mysql-version: ${{ matrix.mysql }}
      - name: Install MySQL Connector
        run: |
          choco install mysql.odbc
      - name: Check
        run: |
          mysql -D nanodbc -e 'SELECT VERSION()'
          Get-OdbcDriver -Platform 64-bit | Select-Object -ExpandProperty Name
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel --target mysql_tests
      - name: Test
        run: |
          $driver = Get-OdbcDriver -Platform 64-bit -Name "MySQL ODBC * ANSI Driver" | Select-Object -First 1 -ExpandProperty Name
          $env:NANODBC_TEST_CONNSTR_MYSQL="Driver={$driver};Server=127.0.0.1;Database=nanodbc;User=root;Password=;big_packets=1;NO_SCHEMA=false"
          ctest --test-dir ${{ github.workspace }}/build --build-config Release --output-on-failure --no-tests=error -R mysql_tests

  test-postgresql:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: [14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PostgreSQL
        uses: ankane/setup-postgres@e9cd5bc1babecb0e441a640646d782056dbb67f5 # v1
        with:
          database: nanodbc
          postgres-version: ${{ matrix.postgres }}
      - name: Install PostgreSQL ODBC Driver
        run: |
          choco install psqlodbc
      - name: Check
        run: |
          psql -d nanodbc -c 'SHOW server_version'
          Get-OdbcDriver -Platform 64-bit | Select-Object -ExpandProperty Name
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel --target postgresql_tests
      - name: Test
        run: |
          $env:NANODBC_TEST_CONNSTR_PGSQL="Driver={PostgreSQL ANSI(x64)};Server=localhost;Port=5432;Database=nanodbc;UID=postgres;PWD="
          ctest --test-dir ${{ github.workspace }}/build --build-config Release --output-on-failure --no-tests=error -R postgresql_tests

  test-sqlite:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install SQLite ODBC Driver
        run: |
          (New-Object Net.WebClient).DownloadFile('http://www.ch-werner.de/sqliteodbc/sqliteodbc_w64.exe', "$($env:TEMP)\sqliteodbc_w64.exe")
          cmd /c start /wait "$($env:TEMP)\sqliteodbc_w64.exe" /S
        shell: powershell
      - name: Check
        run: |
          Get-OdbcDriver -Platform 64-bit | Select-Object -ExpandProperty Name
      - name: Configure
        run: |
          cmake -S ${{ github.workspace }} -B ${{ github.workspace }}/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${{ github.workspace }}/build --config Release --parallel --target sqlite_tests
      - name: Test
        run: |
          ctest --test-dir ${{ github.workspace }}/build --build-config Release --output-on-failure --no-tests=error -R sqlite_tests
