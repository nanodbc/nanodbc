name: "Documentation"

on:
  push:
    branches:
      - main
    paths:
      - "doc/**"
      - "nanodbc/**"
      - "example/**"
  pull_request:
    paths:
      - "doc/**"
      - "nanodbc/**"
      - "example/**"
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to build the documentation from"
        type: string
        required: true
      archive-as:
        description: "Minor series to also keep the build under, e.g. 2.16, as vX.Y/"
        type: string
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Fetch the published versions
        run: git fetch --depth 1 origin gh-pages:refs/remotes/origin/gh-pages
      - name: Install Doxygen
        run: sudo apt-get update -y && sudo apt-get install -y doxygen
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: Install Sphinx
        run: pip install -r doc/requirements.txt
      - name: Build Documentation
        run: make html
        working-directory: ./doc
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation
          path: doc/build/html
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    if: inputs.ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: documentation
          path: html
      - name: Deploy to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARCHIVE_AS: ${{ inputs.archive-as }}
        run: |
          html="${GITHUB_WORKSPACE}/html"
          work="$(mktemp -d)"
          git clone -q --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${work}"
          cd "${work}"

          deploy()
          {
              local dest="$1"
              mkdir -p "${dest}"
              for path in "${html}"/* "${html}"/.[!.]*; do
                  [ -e "${path}" ] || continue
                  rm -rf "${dest:?}/$(basename "${path}")"
              done
              cp -R "${html}/." "${dest}/"
          }

          deploy .
          deploy "v${ARCHIVE_AS}"

          git add --all
          if git diff --cached --quiet; then
            echo "Documentation is unchanged; nothing to deploy." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Documentation for v${ARCHIVE_AS} series"
          git push -q origin gh-pages
          echo "Deployed to https://nanodbc.github.io/nanodbc/" >> "${GITHUB_STEP_SUMMARY}"
