---
# GitHub Actions multi-job workflow for Linux to:
# - build using matrix of GCC and clang versions
# - build using latest defaults and run tests against number of databases
name: "CI Linux"

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci-linux.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci-linux.yml"

# One run per workflow per ref. A new push cancels the run it superseded, except on main,
# where each merge should be allowed to finish reporting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-format:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - check: "nanodbc"
            ignore: ""
          - check: "test"
            ignore: "catch"
          - check: "example"
            ignore: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: "15"
          check-path: ${{ matrix.path['check'] }}
          exclude-regex: ${{ matrix.path['ignore'] }}

  # GCC 13 through 16, the current release and the three before it. Ubuntu 26.04 is the
  # only image carrying that range, and its runner is still a preview, so it is used as a
  # container on a stable runner instead.
  build-gcc:
    needs: [check-format]
    strategy:
      fail-fast: false
      matrix:
        gcc: [16, 15, 14, 13]
        cxxstd: ["20", "17", "14"]
    name: build-gcc-${{ matrix.gcc }}-std-${{ matrix.cxxstd }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake g++-${{ matrix.gcc }} git make unixodbc-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: |
          ${CXX} --version
          cmake --version
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }}
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build

  # Clang 19 through 22, on the same basis as the GCC matrix above.
  build-clang:
    needs: [check-format]
    strategy:
      fail-fast: false
      matrix:
        clang: [22, 21, 20, 19]
        cxxstd: ["20", "17", "14"]
    name: build-clang-${{ matrix.clang }}-std-${{ matrix.cxxstd }}
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      CC: clang-${{ matrix.clang }}
      CXX: clang++-${{ matrix.clang }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates clang-${{ matrix.clang }} cmake git \
            libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev make unixodbc-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check
        run: |
          ${CXX} --version
          cmake --version
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }}
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build

  test-utility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --target utility_tests
      - name: Test
        run: |
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R utility_tests

  test-postgresql:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every PostgreSQL release still under support, oldest to newest. Windows runs
        # against 14 only, because that is all ankane/setup-postgres offers there.
        postgres: [14, 15, 16, 17, 18]
    name: test-postgresql (${{ matrix.postgres }})
    services:
      postgresql:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nanodbc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          sudo apt-get install -y unixodbc-dev odbc-postgresql
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --target postgresql_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_PGSQL="Driver={PostgreSQL ANSI};Server=localhost;Port=5432;Database=nanodbc;UID=postgres;PWD=postgres"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R postgresql_tests

  test-mssql:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Password!123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get update
          curl https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list > /etc/apt/sources.list.d/mssql-release.list
          ACCEPT_EULA=Y apt-get install -y unixodbc-dev msodbcsql17
        shell: sudo bash {0}
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --target mssql_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_MSSQL="Driver={ODBC Driver 17 for SQL Server};Server=localhost;Database=master;UID=sa;PWD=Password!123;"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R mssql_tests

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get install -y unixodbc-dev libsqliteodbc
          cat <<EOF > ${GITHUB_WORKSPACE}/.odbcinst.ini
          [SQLite3]
          Description=SQLite 3 ODBC Driver
          Driver=/usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          Setup=/usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          UsageCount=1
          EOF
          sudo odbcinst -i -d -f ${GITHUB_WORKSPACE}/.odbcinst.ini
          cat /etc/odbcinst.ini
        shell: sudo bash {0}
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --target sqlite_tests
      - name: Test
        run: |
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R sqlite_tests
