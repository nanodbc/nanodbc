name: "CI Linux"

on:
  push:
    branches:
      - main
    paths:
      - "**.cpp"
      - "**.h"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci-linux.yml"
  pull_request:
    paths:
      - "**.cpp"
      - "**.h"
      - "**/CMakeLists.txt"
      - ".github/workflows/ci-linux.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-format:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jidicula/clang-format-action@654a770daa28443dd111d133e4083e21c1075674 # v4.18.0
        with:
          clang-format-version: "20"
          check-path: "."

  build-gcc:
    needs: [check-format]
    strategy:
      fail-fast: false
      matrix:
        gcc: [16, 15, 14, 13]
        cxxstd: ["20", "17"]
    name: build-gcc-${{ matrix.gcc }}-std-${{ matrix.cxxstd }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:26.04
    env:
      CC: gcc-${{ matrix.gcc }}
      CXX: g++-${{ matrix.gcc }}
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /ccache
    steps:
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            ca-certificates ccache cmake g++-${{ matrix.gcc }} git make unixodbc-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /ccache
          key: ccache-gcc${{ matrix.gcc }}-std${{ matrix.cxxstd }}-${{ github.sha }}
          restore-keys: ccache-gcc${{ matrix.gcc }}-std${{ matrix.cxxstd }}-
      - name: Check
        run: |
          ${CXX} --version
          cmake --version
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel

  build-clang:
    needs: [check-format]
    strategy:
      fail-fast: false
      matrix:
        clang: [22, 21, 20, 19]
        cxxstd: ["20", "17"]
    name: build-clang-${{ matrix.clang }}-std-${{ matrix.cxxstd }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:26.04
    env:
      CC: clang-${{ matrix.clang }}
      CXX: clang++-${{ matrix.clang }}
      DEBIAN_FRONTEND: noninteractive
      CCACHE_DIR: /ccache
    steps:
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
            ca-certificates ccache clang-${{ matrix.clang }} cmake git \
            libc++-${{ matrix.clang }}-dev libc++abi-${{ matrix.clang }}-dev make unixodbc-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /ccache
          key: ccache-clang${{ matrix.clang }}-std${{ matrix.cxxstd }}-${{ github.sha }}
          restore-keys: ccache-clang${{ matrix.clang }}-std${{ matrix.cxxstd }}-
      - name: Check
        run: |
          ${CXX} --version
          cmake --version
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel

  test-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc-dev
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-utility-${{ github.sha }}
          restore-keys: ccache-utility-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target utility_tests
      - name: Test
        run: |
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R utility_tests

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    services:
      postgresql:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nanodbc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Password!123
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y ccache clang libclang-rt-dev libc++-dev libc++abi-dev llvm \
            unixodbc-dev odbc-postgresql libsqliteodbc
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get -o DPkg::Lock::Timeout=120 update
          sudo ACCEPT_EULA=Y apt-get -o DPkg::Lock::Timeout=120 install -y msodbcsql17
          sudo odbcinst -i -d -f /usr/share/sqliteodbc/unixodbc.ini
          printf '[nanodbc_dsn]\nDriver=SQLite3\nDatabase=/tmp/nanodbc_dsn.db\n' \
            | sudo tee /etc/odbc.ini
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-coverage-${{ github.sha }}
          restore-keys: ccache-coverage-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build \
            -DCMAKE_BUILD_TYPE=Debug -DNANODBC_ENABLE_COVERAGE=ON \
            -DNANODBC_BUILD_EXAMPLES=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        env:
          CC: clang
          CXX: clang++
      - name: Build
        run: cmake --build ${GITHUB_WORKSPACE}/build --parallel
      - name: Run the suites
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/profraw"
          export NANODBC_TEST_CONNSTR_PGSQL="Driver={PostgreSQL Unicode};Server=localhost;Port=5432;Database=nanodbc;UID=postgres;PWD=postgres"
          export NANODBC_TEST_CONNSTR_MSSQL="Driver={ODBC Driver 17 for SQL Server};Server=localhost;Database=master;UID=sa;PWD=Password!123;"
          for suite in utility sqlite postgresql mssql; do
            LLVM_PROFILE_FILE="${GITHUB_WORKSPACE}/profraw/${suite}-%p.profraw" \
              "${GITHUB_WORKSPACE}/build/test/${suite}_tests"
          done
      - name: Report
        run: |
          llvm-profdata merge -sparse ${GITHUB_WORKSPACE}/profraw/*.profraw \
            -o ${GITHUB_WORKSPACE}/coverage.profdata
          binaries=("${GITHUB_WORKSPACE}/build/test/utility_tests"
                    -object "${GITHUB_WORKSPACE}/build/test/sqlite_tests"
                    -object "${GITHUB_WORKSPACE}/build/test/postgresql_tests"
                    -object "${GITHUB_WORKSPACE}/build/test/mssql_tests")
          llvm-cov export -format=lcov "${binaries[@]}" \
            -instr-profile="${GITHUB_WORKSPACE}/coverage.profdata" \
            "${GITHUB_WORKSPACE}/nanodbc/" > "${GITHUB_WORKSPACE}/coverage.lcov"
          llvm-cov report "${binaries[@]}" \
            -instr-profile="${GITHUB_WORKSPACE}/coverage.profdata" \
            "${GITHUB_WORKSPACE}/nanodbc/" > "${GITHUB_WORKSPACE}/coverage-report.txt"
          llvm-cov export -summary-only "${binaries[@]}" \
            -instr-profile="${GITHUB_WORKSPACE}/coverage.profdata" \
            "${GITHUB_WORKSPACE}/nanodbc/" > "${GITHUB_WORKSPACE}/coverage-summary.json"
          python3 - "${GITHUB_WORKSPACE}" <<'PYTHON'
          import json, os, sys

          workspace = sys.argv[1]
          path = lambda name: os.path.join(workspace, name)

          with open(path("coverage-summary.json")) as f:
              totals = json.load(f)["data"][0]["totals"]
          lines, regions, functions = (
              totals["lines"]["percent"],
              totals["regions"]["percent"],
              totals["functions"]["percent"],
          )

          for threshold, color in ((50, "red"), (60, "orange"), (75, "yellow"), (90, "green")):
              if lines < threshold:
                  break
          else:
              color = "brightgreen"

          with open(path("coverage.json"), "w") as f:
              json.dump(
                  {
                      "schemaVersion": 1,
                      "label": "coverage",
                      "message": f"{lines:.1f}%",
                      "color": color,
                  },
                  f,
              )

          with open(path("coverage-report.txt")) as f:
              report = f.read().rstrip()

          with open(path("coverage-comment.md"), "w") as f:
              f.write(
                  "<!-- nanodbc-coverage -->\n"
                  "## Coverage\n\n"
                  f"| lines | regions | functions |\n"
                  f"| ----- | ------- | --------- |\n"
                  f"| {lines:.1f}% | {regions:.1f}% | {functions:.1f}% |\n\n"
                  "<details><summary>Per file</summary>\n\n"
                  f"```\n{report}\n```\n\n"
                  "</details>\n"
              )
          print(f"lines {lines:.1f}%  regions {regions:.1f}%  functions {functions:.1f}%")
          PYTHON
          cat "${GITHUB_WORKSPACE}/coverage-comment.md" >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload the lcov report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: coverage.lcov
          overwrite: true
      - name: Comment the coverage on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          existing="$(gh api "repos/${REPO}/issues/${NUMBER}/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- nanodbc-coverage -->"))) | .[0].id // empty')"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" \
              -F body=@"${GITHUB_WORKSPACE}/coverage-comment.md" > /dev/null
          else
            gh api "repos/${REPO}/issues/${NUMBER}/comments" \
              -F body=@"${GITHUB_WORKSPACE}/coverage-comment.md" > /dev/null
          fi
      - name: Publish the coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          work="$(mktemp -d)"
          cp "${GITHUB_WORKSPACE}/coverage.json" "${work}/"
          cd "${work}"
          git init -q
          git checkout -qb badges
          git add coverage.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Coverage badge for ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  test-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 15, 16, 17, 18]
        cxxstd: ["17"]
        unicode: ["OFF"]
        # The newest server also runs the suite built as C++20, to catch what a later
        # standard changes. Repeating that for every server version would buy nothing,
        # what differs being the library rather than the server.
        include:
          - postgres: 18
            cxxstd: "20"
            unicode: "OFF"
          # The newest server also runs a Unicode build, through the Unicode driver, the
          # ANSI one being unable to take a wide parameter.
          - postgres: 18
            cxxstd: "17"
            unicode: "ON"
    name: test-postgresql (${{ matrix.postgres }}, c++${{ matrix.cxxstd }}, unicode ${{ matrix.unicode }})
    services:
      postgresql:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nanodbc
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc-dev odbc-postgresql
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-postgresql-${{ matrix.cxxstd }}-${{ matrix.unicode }}-${{ github.sha }}
          restore-keys: ccache-postgresql-${{ matrix.cxxstd }}-${{ matrix.unicode }}-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DNANODBC_ENABLE_UNICODE=${{ matrix.unicode }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target postgresql_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_PGSQL="Driver={PostgreSQL Unicode};Server=localhost;Port=5432;Database=nanodbc;UID=postgres;PWD=postgres"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R postgresql_tests

  test-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cxxstd: ["17", "20"]
    name: test-oracle (c++${{ matrix.cxxstd }})
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        ports:
          - 1521:1521
        env:
          ORACLE_PASSWORD: nanodbc
        # The image ships /opt/oracle/healthcheck.sh but declares no health check of its
        # own, so the script is named here. A faststart image opens in well under a minute.
        options: >-
          --health-cmd /opt/oracle/healthcheck.sh
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc unixodbc-dev odbcinst unzip libaio1t64
        shell: sudo bash {0}
      - name: Install Oracle Instant Client
        # Instant Client is published for x86_64 only, which the runners are. The driver
        # asks for libaio.so.1, which Ubuntu ships as libaio.so.1t64.
        run: |
          curl -fsSL -o /tmp/ic-basic.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-basic-linuxx64.zip
          curl -fsSL -o /tmp/ic-odbc.zip https://download.oracle.com/otn_software/linux/instantclient/instantclient-odbc-linuxx64.zip
          sudo unzip -oq /tmp/ic-basic.zip -d /opt/oracle
          sudo unzip -oq /tmp/ic-odbc.zip -d /opt/oracle
          ic=$(ls -d /opt/oracle/instantclient_*)
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libaio.so.1t64 /usr/lib/x86_64-linux-gnu/libaio.so.1
          echo "${ic}" | sudo tee /etc/ld.so.conf.d/oracle-instantclient.conf
          sudo ldconfig
          printf '[Oracle]\nDescription=Oracle Instant Client ODBC\nDriver=%s/libsqora.so.23.1\n' "${ic}" | sudo odbcinst -i -d -r
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-oracle-${{ matrix.cxxstd }}-${{ github.sha }}
          restore-keys: ccache-oracle-${{ matrix.cxxstd }}-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target oracle_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_ORACLE="Driver={Oracle};DBQ=localhost:1521/FREEPDB1;UID=system;PWD=nanodbc;"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R oracle_tests

  test-mssql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unicode: ["OFF", "ON"]
        cxxstd: ["17", "20"]
    name: test-mssql (unicode ${{ matrix.unicode }}, c++${{ matrix.cxxstd }})
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: Password!123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          curl https://packages.microsoft.com/keys/microsoft.asc | apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/prod.list > /etc/apt/sources.list.d/mssql-release.list
          ACCEPT_EULA=Y apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc-dev msodbcsql18
        shell: sudo bash {0}
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-mssql-${{ matrix.unicode }}-${{ matrix.cxxstd }}-${{ github.sha }}
          restore-keys: ccache-mssql-${{ matrix.unicode }}-${{ matrix.cxxstd }}-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DNANODBC_ENABLE_UNICODE=${{ matrix.unicode }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target mssql_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_MSSQL="Driver={ODBC Driver 18 for SQL Server};Server=localhost;Database=master;UID=sa;PWD=Password!123;TrustServerCertificate=yes;"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R mssql_tests

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        unicode: ["OFF", "ON"]
        cxxstd: ["17", "20"]
    name: test-sqlite (unicode ${{ matrix.unicode }}, c++${{ matrix.cxxstd }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc-dev libsqliteodbc
          cat <<EOF > ${GITHUB_WORKSPACE}/.odbcinst.ini
          [SQLite3]
          Description=SQLite 3 ODBC Driver
          Driver=/usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          Setup=/usr/lib/x86_64-linux-gnu/odbc/libsqlite3odbc.so
          UsageCount=1
          EOF
          sudo odbcinst -i -d -f ${GITHUB_WORKSPACE}/.odbcinst.ini
          cat /etc/odbcinst.ini
          printf '[nanodbc_dsn]\nDriver=SQLite3\nDatabase=/tmp/nanodbc_dsn.db\n' \
            | sudo tee /etc/odbc.ini
        shell: sudo bash {0}
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-sqlite-${{ matrix.unicode }}-${{ matrix.cxxstd }}-${{ github.sha }}
          restore-keys: ccache-sqlite-${{ matrix.unicode }}-${{ matrix.cxxstd }}-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DNANODBC_ENABLE_UNICODE=${{ matrix.unicode }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target sqlite_tests
      - name: Test
        run: |
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R sqlite_tests

  test-clickhouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxxstd: ["17", "20"]
        # The release ships an ANSI and a Unicode driver, and either serves either width
        # of build, so each is covered by the build that matches it.
        build:
          - { unicode: "OFF", driver: "ANSI" }
          - { unicode: "ON", driver: "Unicode" }
    name: test-clickhouse (unicode ${{ matrix.build.unicode }}, c++${{ matrix.cxxstd }})
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
        env:
          CLICKHOUSE_USER: nanodbc
          CLICKHOUSE_PASSWORD: nanodbc
          CLICKHOUSE_DB: nanodbc
        options: >-
          --health-cmd "clickhouse-client --user nanodbc --password nanodbc --query 'select 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc unixodbc-dev odbcinst unzip
        shell: sudo bash {0}
      # The release ships an ANSI and a Unicode driver and both are registered; the
      # connection string below names the one this build uses. The Linux assets are
      # published for x86_64 only, which the runners are.
      - name: Install the ClickHouse ODBC driver
        run: |
          curl -fsSL -o /tmp/clickhouse-odbc.zip https://github.com/ClickHouse/clickhouse-odbc/releases/download/v1.5.5.20260810/clickhouse-odbc-linux-Clang-UnixODBC-Release.zip
          unzip -oq /tmp/clickhouse-odbc.zip -d /tmp/clickhouse-odbc
          sudo tar -xzf /tmp/clickhouse-odbc/clickhouse-odbc-1.5.5-Linux.tar.gz -C /opt
          sudo mv /opt/clickhouse-odbc-1.5.5-Linux /opt/clickhouse-odbc
          printf '[ClickHouse ODBC Driver (ANSI)]\nDescription=ODBC Driver (ANSI) for ClickHouse\nDriver=/opt/clickhouse-odbc/lib/libclickhouseodbc.so\n\n[ClickHouse ODBC Driver (Unicode)]\nDescription=ODBC Driver (Unicode) for ClickHouse\nDriver=/opt/clickhouse-odbc/lib/libclickhouseodbcw.so\n' \
            | sudo odbcinst -i -d -r
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-clickhouse-${{ matrix.build.unicode }}-${{ matrix.cxxstd }}-${{ github.sha }}
          restore-keys: ccache-clickhouse-${{ matrix.build.unicode }}-${{ matrix.cxxstd }}-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DNANODBC_ENABLE_UNICODE=${{ matrix.build.unicode }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target clickhouse_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_CLICKHOUSE="Driver={ClickHouse ODBC Driver (${{ matrix.build.driver }})};Server=localhost;Port=8123;Database=nanodbc;UID=nanodbc;PWD=nanodbc;"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R clickhouse_tests

  test-firebird:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        cxxstd: ["17", "20"]
    # A narrow build only. The driver exports Unicode entry points, but SQLDriverConnectW
    # fails against them and answers with a malformed diagnostic, in the 3.0.1 release and
    # in 3.5.0-rc1 alike, so a Unicode build has no way to reach Firebird.
    name: test-firebird (c++${{ matrix.cxxstd }})
    services:
      firebird:
        image: firebirdsql/firebird:5
        ports:
          - 3050:3050
        env:
          FIREBIRD_ROOT_PASSWORD: nanodbc
          FIREBIRD_USER: nanodbc
          FIREBIRD_PASSWORD: nanodbc
          FIREBIRD_DATABASE: nanodbc.fdb
        options: >-
          --health-cmd "echo 'select 1 from rdb$database;' | isql -user sysdba -password nanodbc -q /var/lib/firebird/data/nanodbc.fdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc unixodbc-dev odbcinst unzip libfbclient2
        shell: sudo bash {0}
      # The driver loads libfbclient by its unversioned name, which only the development
      # package carries, so the link is made rather than pulling the headers in for it.
      - name: Install the Firebird ODBC driver
        run: |
          curl -fsSL -o /tmp/firebird-odbc.zip https://github.com/FirebirdSQL/firebird-odbc-driver/releases/download/v3-0-1-release/linux_libs.zip
          unzip -oq /tmp/firebird-odbc.zip -d /tmp/firebird-odbc
          sudo mkdir -p /opt/firebird-odbc/lib
          sudo cp /tmp/firebird-odbc/Release_x86_64/libOdbcFb.so /opt/firebird-odbc/lib/
          libdir=$(dirname "$(find /usr/lib -name libfbclient.so.2 | head -1)")
          sudo ln -sf "${libdir}/libfbclient.so.2" "${libdir}/libfbclient.so"
          sudo ldconfig
          printf '[Firebird]\nDescription=Firebird ODBC Driver\nDriver=/opt/firebird-odbc/lib/libOdbcFb.so\n' \
            | sudo odbcinst -i -d -r
      - name: Restore compiled objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ccache-firebird-${{ matrix.cxxstd }}-${{ github.sha }}
          path: ~/.ccache
          restore-keys: ccache-firebird-${{ matrix.cxxstd }}-
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target firebird_tests
      - name: Test
        run: |
          export NANODBC_TEST_CONNSTR_FIREBIRD="Driver={Firebird};DBNAME=localhost/3050:/var/lib/firebird/data/nanodbc.fdb;UID=sysdba;PWD=nanodbc;CHARSET=UTF8;"
          ctest --test-dir ${GITHUB_WORKSPACE}/build --output-on-failure --no-tests=error -R firebird_tests

  test-db2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cxxstd: ["17"]
    name: test-db2 (c++${{ matrix.cxxstd }})
    services:
      db2:
        image: icr.io/db2_community/db2:latest
        ports:
          - 50000:50000
        options: >-
          --privileged
          --health-cmd "su - db2inst1 -c 'db2 connect to nanodbc'"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 40
          --health-start-period 300s
        env:
          LICENSE: accept
          DB2INSTANCE: db2inst1
          DB2INST1_PASSWORD: nanodbc
          DBNAME: nanodbc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          apt-get -o DPkg::Lock::Timeout=120 update
          apt-get -o DPkg::Lock::Timeout=120 install -y ccache unixodbc unixodbc-dev odbcinst
        shell: sudo bash {0}
      # The download needs no credentials. The licence is IBM's International Program
      # License Agreement, carried in the tarball under clidriver/license.
      - name: Install the Db2 CLI driver
        run: |
          curl -fsSL -o /tmp/db2-clidriver.tar.gz https://public.dhe.ibm.com/ibmdl/export/pub/software/data/db2/drivers/odbc_cli/linuxx64_odbc_cli.tar.gz
          sudo mkdir -p /opt/ibm
          sudo tar -xzf /tmp/db2-clidriver.tar.gz -C /opt/ibm
          echo /opt/ibm/clidriver/lib | sudo tee /etc/ld.so.conf.d/db2-clidriver.conf
          sudo ldconfig
          printf '[IBM DB2 ODBC DRIVER]\nDescription=IBM Data Server Driver for ODBC and CLI\nDriver=/opt/ibm/clidriver/lib/libdb2.so\n' \
            | sudo odbcinst -i -d -r
      - name: Configure
        run: |
          cmake -S ${GITHUB_WORKSPACE} -B ${GITHUB_WORKSPACE}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.cxxstd }}
      - name: Build
        run: |
          cmake --build ${GITHUB_WORKSPACE}/build --parallel --target db2_tests
      # TEMPORARY: this push is a diagnostic. The indicator probe establishes, on a native
      # x86_64 runner, whether the driver writes only 32 bits of an 8 byte SQLLEN, and the
      # loop reports which shared cases pass there. Both go before this is ready to merge.
      - name: Diagnose the driver on native x86_64
        run: |
          export NANODBC_TEST_CONNSTR_DB2="Driver={IBM DB2 ODBC DRIVER};Database=nanodbc;Hostname=localhost;Port=50000;Protocol=TCPIP;Uid=db2inst1;Pwd=nanodbc;"
          gcc -o /tmp/np2 ${GITHUB_WORKSPACE}/utility/db2-indicator-probe.c -lodbc
          /tmp/np2 "$NANODBC_TEST_CONNSTR_DB2" || true
          echo "===== per-test triage ====="
          for t in $(${GITHUB_WORKSPACE}/build/test/db2_tests --list-tests --verbosity quiet | sed 's/^  //' | grep '^test_'); do
            if ${GITHUB_WORKSPACE}/build/test/db2_tests "$t" >/dev/null 2>&1; then echo "PASS $t"; else echo "FAIL $t"; fi
          done
