name: "Release"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v2.16.0"
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      version: ${{ steps.notes.outputs.version }}
      series: ${{ steps.notes.outputs.series }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Read the release notes
        id: notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          recorded="$(cat VERSION.txt)"
          if [ "${recorded}" != "${version}" ]; then
            echo "error: ${TAG} does not match VERSION.txt, which reads '${recorded}'." >&2
            exit 1
          fi
          ./utility/changelog.sh "${TAG}" > "${RUNNER_TEMP}/notes.md"
          {
            echo "version=${version}"
            echo "tag=${TAG}"
            echo "series=${version%.*}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "## Release notes for ${TAG}"
            echo
            cat "${RUNNER_TEMP}/notes.md"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "${TAG}" --title "${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
          fi

  documentation:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/documentation.yml
    with:
      ref: v${{ needs.release.outputs.version }}
      archive-as: ${{ needs.release.outputs.series }}
