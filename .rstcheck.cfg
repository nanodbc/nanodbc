[rstcheck]
# Breathe supplies this one, so docutils alone does not know it.
ignore_directives=autodoxygenfile
# doc/conf.py defines this in rst_prolog, which rstcheck does not read.
ignore_substitutions=release_tag
# versions.rst includes a fragment that conf.py writes on every build, into a directory
# that is not committed. A checkout that has not been built does not have it, so the
# include cannot resolve here. Scoped to that one generated file, so any other include
# pointing at something missing is still reported.
ignore_messages=(File referenced in "include" directive not found: .*_generated/versions\.rst\.inc)
# INFO-level notes are Sphinx-isms (implicit section targets) rather than defects.
report_level=WARNING
