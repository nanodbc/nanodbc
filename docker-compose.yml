---
# nanodbc development and testing multi-container docker setup.
#
# The database servers run only as containers, so nothing has to be installed on the host.
#
#   docker compose up -d              start the database servers
#   docker compose run --rm nanodbc   shell in the build container, with drivers configured
#
# Each server version can be overridden, so a version the CI matrix covers can be
# reproduced locally, for example POSTGRES_VERSION=14 docker compose up -d
services:
  mysql:
    image: mysql:${MYSQL_VERSION:-26.7}
    container_name: nanomysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: &default_credential nanodbc
      MYSQL_DATABASE: *default_credential
      MYSQL_USER: *default_credential
      MYSQL_PASSWORD: *default_credential
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-unanodbc",
          "-pnanodbc",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  mariadb:
    image: mariadb:${MARIADB_VERSION:-12.3}
    container_name: nanomariadb
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MARIADB_ROOT_PASSWORD: *default_credential
      MARIADB_DATABASE: *default_credential
      MARIADB_USER: *default_credential
      MARIADB_PASSWORD: *default_credential
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  pgsql:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    container_name: nanopgsql
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: *default_credential
      POSTGRES_PASSWORD: *default_credential
      POSTGRES_DB: *default_credential
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanodbc -d nanodbc"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2025}-latest
    container_name: nanomssql
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: &mssql_credential Password12!
    healthcheck:
      test:
        - "CMD"
        - "/opt/mssql-tools18/bin/sqlcmd"
        - "-S"
        - "localhost"
        - "-U"
        - "sa"
        - "-P"
        - *mssql_credential
        - "-C"
        - "-Q"
        - "select 1"
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-latest}
    container_name: nanoclickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_USER: *default_credential
      CLICKHOUSE_PASSWORD: *default_credential
      CLICKHOUSE_DB: *default_credential
    healthcheck:
      test:
        [
          "CMD",
          "clickhouse-client",
          "--user",
          "nanodbc",
          "--password",
          "nanodbc",
          "--query",
          "select 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  firebird:
    image: firebirdsql/firebird:${FIREBIRD_VERSION:-5}
    container_name: nanofirebird
    restart: unless-stopped
    ports:
      - "3050:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: *default_credential
      FIREBIRD_USER: *default_credential
      FIREBIRD_PASSWORD: *default_credential
      FIREBIRD_DATABASE: nanodbc.fdb
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'select 1 from rdb$$database;' | isql -user sysdba -password nanodbc -q /var/lib/firebird/data/nanodbc.fdb",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  oracle:
    image: gvenzl/oracle-free:${ORACLE_VERSION:-23-slim-faststart}
    container_name: nanooracle
    restart: unless-stopped
    # Instant Client is published for x86_64 only.
    platform: linux/amd64
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: *default_credential
    # The image ships a health check script but declares no health check of its own,
    # so the script is named here. A faststart image opens in well under a minute.
    healthcheck:
      test: ["CMD", "/opt/oracle/healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  nanodbc:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nanodbc
    stdin_open: true
    tty: true
    depends_on:
      pgsql:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      mssql:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      firebird:
        condition: service_healthy
    # Oracle is deliberately not depended on: it takes minutes to open and its driver is
    # published for x86_64 only, so waiting for it would cost every run on every host to
    # serve the one suite that cannot run on some of them. Start it when it is wanted,
    # with docker compose up -d oracle.

    volumes:
      - .:/opt/nanodbc
    working_dir: /opt/nanodbc
    environment:
      MYSQL_HOST: mysql
      USER: *default_credential
      MYSQL_PWD: *default_credential
      SQLCMDSERVER: mssql
      SQLCMDUSER: sa
      SQLCMDPASSWORD: *mssql_credential
      PGHOST: pgsql
      PGUSER: *default_credential
      PGPASSWORD: *default_credential
      PGDATABASE: *default_credential
      NANODBC_TEST_CONNSTR_SQLITE: "Driver={SQLite3};Database=/tmp/nanodbc.db;"
      # The Unicode driver, which serves a narrow build as well as a wide one. The ANSI
      # driver refuses a wide parameter, as it should, so a Unicode build cannot use it.
      NANODBC_TEST_CONNSTR_PGSQL: "Driver={PostgreSQL Unicode};Server=pgsql;Port=5432;Database=nanodbc;UID=nanodbc;PWD=nanodbc;"
      NANODBC_TEST_CONNSTR_MYSQL: "Driver={MySQL ODBC 8.4 ANSI Driver};Server=mysql;Database=nanodbc;User=root;Password=nanodbc;big_packets=1;"
      NANODBC_TEST_CONNSTR_MARIADB: "Driver={MariaDB Unicode};Server=mariadb;Port=3306;Database=nanodbc;User=root;Password=nanodbc;"
      NANODBC_TEST_CONNSTR_MSSQL: "Driver={ODBC Driver 18 for SQL Server};Server=mssql;Database=master;UID=sa;PWD=Password12!;TrustServerCertificate=yes;"
      NANODBC_TEST_CONNSTR_ORACLE: "Driver={Oracle};DBQ=oracle:1521/FREEPDB1;UID=system;PWD=nanodbc;"
      # Either of the two drivers the release ships serves either width of build; the
      # Unicode one is named here, and CI pairs each with the build that matches it.
      NANODBC_TEST_CONNSTR_CLICKHOUSE: "Driver={ClickHouse ODBC Driver (Unicode)};Server=clickhouse;Port=8123;Database=nanodbc;UID=nanodbc;PWD=nanodbc;"
      # A narrow build only: the driver's Unicode entry points cannot open a connection,
      # so a Unicode build of nanodbc has no way to reach Firebird.
      NANODBC_TEST_CONNSTR_FIREBIRD: "Driver={Firebird};DBNAME=firebird/3050:/var/lib/firebird/data/nanodbc.fdb;UID=sysdba;PWD=nanodbc;CHARSET=UTF8;"
